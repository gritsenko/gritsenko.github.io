<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playables — Igor Gritsenko</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14171c; --panel2:#1b1f26; --line:#272c35;
    --text:#e7eaee; --muted:#9aa3af; --accent:#5b8cff; --accent2:#7c5cff;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:inherit}
  .wrap{max-width:1200px;margin:0 auto;padding:32px 20px 80px}
  header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 18px;margin-bottom:24px}
  header.top h1{font-size:26px;margin:0;letter-spacing:-.02em}
  header.top .sub{color:var(--muted);font-size:14px}
  header.top .count{margin-left:auto;color:var(--muted);font-size:13px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
  .search{flex:1 1 240px;min-width:200px;display:flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
  .search input{flex:1;background:none;border:0;color:var(--text);outline:none;font-size:14px}
  .search svg{opacity:.5;flex:none}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);cursor:pointer;font-size:12.5px;user-select:none;transition:.15s}
  .chip:hover{border-color:#3a424f;color:var(--text)}
  .chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-3px);border-color:#3d4653}
  .thumb{position:relative;aspect-ratio:16/10;background:#0f1216 center/cover no-repeat;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .noimg{position:absolute;inset:0;display:grid;place-items:center;color:#3a424f;font-size:30px}
  .badge{position:absolute;top:9px;left:9px;padding:3px 9px;border-radius:999px;font-size:11px;
    font-weight:600;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);color:#fff}
  .badge.zip{background:rgba(124,92,255,.85)}
  .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:.15s;
    background:rgba(4,6,10,.35)}
  .card:hover .play{opacity:1}
  .play span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);
    display:grid;place-items:center}
  .play span::after{content:"";border-style:solid;border-width:9px 0 9px 15px;
    border-color:transparent transparent transparent #0b0d10;margin-left:3px}
  .meta{padding:12px 13px 14px}
  .meta .t{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
  .meta .p{color:var(--muted);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .tags{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px}
  .meta .tags b{font-weight:500;font-size:11px;color:var(--muted);background:var(--panel2);
    border:1px solid var(--line);padding:2px 7px;border-radius:6px}
  .empty{color:var(--muted);text-align:center;padding:60px 0}

  /* ---- modal ---- */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(4,6,10,.72);backdrop-filter:blur(8px);
    display:none;padding:24px;overflow:auto}
  .overlay.on{display:flex;align-items:safe center;justify-content:center;gap:34px;flex-wrap:wrap}
  .stage{display:flex;flex-direction:column;align-items:center;gap:14px}
  .phone{position:relative;height:min(820px,86vh);aspect-ratio:400/860;background:#05070a;
    border-radius:44px;padding:30px 12px;box-shadow:0 0 0 2px #2a2f38,0 30px 80px rgba(0,0,0,.6)}
  .phone::before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:78px;height:8px;background:#20242b;border-radius:999px;z-index:3}
  .screen{width:100%;height:100%;border-radius:24px;overflow:hidden;background:#000;position:relative}
  .screen iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  .screen .ziphold{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;padding:24px;text-align:center;background:#0f1216 center/cover}
  .screen .ziphold .sh{position:absolute;inset:0;background:center/cover;filter:brightness(.4)}
  .screen .ziphold .in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px}
  .screen .ziphold .dl{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    text-decoration:none;padding:11px 20px;border-radius:12px;font-weight:600;font-size:14px}
  .barbtns{display:flex;gap:10px}
  .barbtns button,.barbtns a{background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:8px 13px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;
    align-items:center;gap:6px}
  .barbtns button:hover,.barbtns a:hover{border-color:#3d4653}

  .info{width:320px;max-width:88vw}
  .info h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
  .info .row{color:var(--muted);font-size:13px;margin:10px 0}
  .info .row b{color:var(--text);font-weight:600}
  .info .storelinks{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .info .storelinks a{color:var(--accent);text-decoration:none;font-size:13px;word-break:break-all}
  .info .tagline{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .info .tagline b{font-weight:500;font-size:12px;color:var(--muted);background:var(--panel2);
    border:1px solid var(--line);padding:3px 9px;border-radius:7px}
  .close{position:fixed;top:16px;right:18px;z-index:60;width:40px;height:40px;border-radius:50%;
    background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:20px;cursor:pointer}
  .close:hover{border-color:#3d4653}
  @media(max-width:720px){ .info{order:-1;width:min(400px,90vw)} .overlay{padding:16px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Playables</h1>
    <span class="sub">Igor Gritsenko · playable ad prototypes</span>
    <span class="count" id="count"></span>
  </header>

  <div class="controls">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search by name, project, tag…" autocomplete="off">
    </label>
    <div class="chips" id="chips"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No playables match.</div>
</div>

<div class="overlay" id="overlay">
  <button class="close" id="close" aria-label="Close">✕</button>
  <div class="stage" id="stage"></div>
  <div class="info" id="info"></div>
</div>

<script src="catalog.js"></script>
<script>
(function(){
  var DATA = (window.PLAYABLES || []).slice();
  var grid = document.getElementById('grid');
  var chipsEl = document.getElementById('chips');
  var qEl = document.getElementById('q');
  var countEl = document.getElementById('count');
  var activeTag = null, query = '';

  countEl.textContent = DATA.length + ' playables';

  // tag universe
  var tagSet = {};
  DATA.forEach(function(p){ (p.tags||[]).forEach(function(t){ tagSet[t]=(tagSet[t]||0)+1; }); });
  var tags = Object.keys(tagSet).sort(function(a,b){ return tagSet[b]-tagSet[a] || a.localeCompare(b); });
  tags.forEach(function(t){
    var c = document.createElement('div'); c.className='chip'; c.textContent=t;
    c.onclick=function(){ activeTag = activeTag===t?null:t;
      [].forEach.call(chipsEl.children,function(x){x.classList.toggle('on',x.textContent===activeTag);});
      render(); };
    chipsEl.appendChild(c);
  });

  function esc(s){ return (s||'').replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }

  function matches(p){
    if(activeTag && (p.tags||[]).indexOf(activeTag)<0) return false;
    if(query){
      var hay=(p.title+' '+((p.project&&p.project.name)||'')+' '+(p.tags||[]).join(' ')+' '+(p.details||'')).toLowerCase();
      if(hay.indexOf(query)<0) return false;
    }
    return true;
  }

  function render(){
    var list = DATA.filter(matches);
    grid.innerHTML='';
    document.getElementById('empty').style.display = list.length?'none':'block';
    list.forEach(function(p){
      var card=document.createElement('div'); card.className='card';
      var proj = p.project&&p.project.name ? p.project.name : '';
      var thumb = p.thumb
        ? '<img loading="lazy" src="'+encodeURI(p.thumb)+'" alt="">'
        : '<div class="noimg">▤</div>';
      card.innerHTML =
        '<div class="thumb">'+thumb+
          '<span class="badge'+(p.type==='zip'?' zip':'')+'">'+(p.type==='zip'?'ZIP':'HTML')+'</span>'+
          '<span class="play"><span></span></span>'+
        '</div>'+
        '<div class="meta"><div class="t">'+esc(p.title)+'</div>'+
          (proj?'<div class="p">'+esc(proj)+'</div>':'')+
          ((p.tags&&p.tags.length)?'<div class="tags">'+p.tags.map(function(t){return '<b>'+esc(t)+'</b>';}).join('')+'</div>':'')+
        '</div>';
      card.onclick=function(){ open(p); };
      grid.appendChild(card);
    });
  }

  // ---- modal ----
  var overlay=document.getElementById('overlay'),
      stage=document.getElementById('stage'), info=document.getElementById('info');

  function open(p){
    var screen;
    if(p.type==='zip'){
      screen='<div class="ziphold">'+
        (p.thumb?'<div class="sh" style="background-image:url('+JSON.stringify(encodeURI(p.thumb))+')"></div>':'')+
        '<div class="in"><div style="font-size:13px;color:#9aa3af">ZIP playable — not previewable inline</div>'+
        '<a class="dl" href="'+encodeURI(p.url)+'" download>Download ZIP</a></div></div>';
    } else {
      screen='<iframe src="'+encodeURI(p.url)+'" allow="autoplay; fullscreen; accelerometer; gyroscope"></iframe>';
    }
    stage.innerHTML =
      '<div class="phone"><div class="screen">'+screen+'</div></div>'+
      '<div class="barbtns">'+
        (p.type!=='zip'?'<button id="reload">↻ Reload</button>':'')+
        '<a href="'+encodeURI(p.url)+'" target="_blank" rel="noopener">↗ Open in new tab</a>'+
      '</div>';

    var proj=p.project||{};
    var store='';
    if(proj.appStore)  store+='<a href="'+esc(proj.appStore)+'" target="_blank" rel="noopener">App Store ↗</a>';
    if(proj.googlePlay)store+='<a href="'+esc(proj.googlePlay)+'" target="_blank" rel="noopener">Google Play ↗</a>';
    info.innerHTML =
      '<h2>'+esc(p.title)+'</h2>'+
      (proj.name?'<div class="row"><b>Project:</b> '+esc(proj.name)+(proj.shortName?' ('+esc(proj.shortName)+')':'')+'</div>':'')+
      (p.details?'<div class="row">'+esc(p.details)+'</div>':'')+
      (p.created?'<div class="row"><b>Created:</b> '+esc(p.created)+'</div>':'')+
      ((p.tags&&p.tags.length)?'<div class="tagline">'+p.tags.map(function(t){return '<b>'+esc(t)+'</b>';}).join('')+'</div>':'')+
      (store?'<div class="storelinks">'+store+'</div>':'');

    var rl=document.getElementById('reload');
    if(rl) rl.onclick=function(){ var f=stage.querySelector('iframe'); if(f) f.src=f.src; };
    overlay.classList.add('on'); document.body.style.overflow='hidden';
    location.hash=p.slug;
  }
  function close(){ overlay.classList.remove('on'); stage.innerHTML=''; info.innerHTML='';
    document.body.style.overflow=''; if(location.hash) history.replaceState(null,'',location.pathname+location.search); }
  document.getElementById('close').onclick=close;
  overlay.onclick=function(e){ if(e.target===overlay) close(); };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });

  qEl.addEventListener('input',function(){ query=qEl.value.trim().toLowerCase(); render(); });

  render();

  // deep link: #slug opens that playable (on load and on hash change)
  function openFromHash(){
    var s=(location.hash||'').slice(1); if(!s) return;
    var hit=DATA.filter(function(p){return p.slug===s;})[0];
    if(hit) open(hit);
  }
  window.addEventListener('hashchange', openFromHash);
  openFromHash();
})();
</script>
</body>
</html>
