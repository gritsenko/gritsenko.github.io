<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0d0b10">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
    <title>Цветная Сортировка: Тона Кожи</title>

    <!-- inline-фавикон: ещё один сетевой запрос игре не нужен -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%23FFCC4D%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23A65E19%27/%3E%3C/svg%3E">

    <link rel="preload" href="fonts/nunito-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Спрайт иконок: один раз в документе, дальше только <use> -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-chevron-down" viewBox="0 0 448 512">
                <path d="M201.4 374.6a32 32 0 0 0 45.2 0l160-160a32 32 0 0 0-45.2-45.2L224 306.7 86.6 169.4a32 32 0 0 0-45.2 45.2l160 160z"/>
            </symbol>
            <symbol id="i-circle-arrow-down" viewBox="0 0 512 512">
                <path d="M256 0a256 256 0 1 1 0 512A256 256 0 0 1 256 0zm22.6 388.7 96-96a32 32 0 0 0-45.2-45.3L288 301.5V160a32 32 0 0 0-64 0v141.5l-41.4-54.1a32 32 0 0 0-45.2 45.3l96 96a32 32 0 0 0 45.2 0z"/>
            </symbol>
            <symbol id="i-undo" viewBox="0 0 512 512">
                <path d="M125.7 160H176a32 32 0 0 1 0 64H48a32 32 0 0 1-32-32V64a32 32 0 0 1 64 0v51.2L97.6 97.6c87.5-87.5 229.3-87.5 316.8 0s87.5 229.3 0 316.8-229.3 87.5-316.8 0a32 32 0 0 1 45.2-45.2 158.4 158.4 0 1 0 0-224L125.7 160z"/>
            </symbol>
            <symbol id="i-trophy" viewBox="0 0 576 512">
                <path d="M400 0H176c-26.5 0-48.1 21.8-47.1 48.2.2 5.3.4 10.6.7 15.8H24c-13.3 0-24 10.7-24 24 0 91.6 54.5 129.8 99.8 146.2 24.3 62 61.6 90.3 87 103.3 3.5 1.8 5.2 5.2 5.2 8.5V464h-32c-26.5 0-48 21.5-48 48 0 0 0 0 0 0h352c0 0 0 0 0 0 0-26.5-21.5-48-48-48h-32v-118c0-3.3 1.7-6.7 5.2-8.5 25.4-13 62.7-41.3 87-103.3C521.5 217.8 576 179.6 576 88c0-13.3-10.7-24-24-24H446.4c.3-5.2.5-10.5.7-15.8C448.1 21.8 426.5 0 400 0zM48.2 112h84.3c8.2 62.4 24 108.1 42.4 141.6-25.9-16.6-53.1-45.6-63.1-102.5-4.3-24.4-11.7-32.6-63.6-39.1zm479.6 0c-51.9 6.5-59.3 14.7-63.6 39.1-10 56.9-37.2 85.9-63.1 102.5 18.4-33.5 34.2-79.2 42.4-141.6h84.3z"/>
            </symbol>
            <symbol id="i-star" viewBox="0 0 576 512">
                <path d="M316.9 18C311.6 7 300.4 0 288.1 0s-23.4 7-28.8 18L195 150.3 51.4 171.5c-12 1.8-22 10.2-25.7 21.7s-.7 24.2 7.9 32.7L137.8 329 113.2 474.7c-2 12 3 24.2 12.9 31.3s23 8 33.8 2.3l128.3-68.5 128.3 68.5c10.8 5.7 23.9 4.9 33.8-2.3s14.9-19.3 12.9-31.3L438.5 329 542.7 225.9c8.6-8.5 11.7-21.2 7.9-32.7s-13.7-19.9-25.7-21.7L381.2 150.3 316.9 18z"/>
            </symbol>
            <symbol id="i-arrow-right" viewBox="0 0 448 512">
                <path d="M438.6 278.6a32 32 0 0 0 0-45.2l-160-160a32 32 0 0 0-45.2 45.2L338.7 224H32a32 32 0 0 0 0 64h306.7L233.4 393.4a32 32 0 0 0 45.2 45.2l160-160z"/>
            </symbol>
        </defs>
    </svg>

    <main class="game">

        <header class="hud">
            <div class="hud__info">
                <span class="hud__level" id="level-title">Уровень 1</span>
                <span class="hud__moves">Ходы: <b id="moves-counter">0</b></span>
            </div>
            <button type="button" class="btn-undo" id="btn-undo" disabled>
                <svg aria-hidden="true"><use href="#i-undo"></use></svg>
                Отмена
            </button>
        </header>

        <div class="field">
            <!-- Игровое поле: клетки — статичная CSS-сетка,
                 фишки — абсолютный слой поверх, двигается только transform'ом -->
            <div class="board">
                <div class="board__grid" id="board-grid"></div>
                <div class="board__tiles" id="tiles-layer"></div>
            </div>

            <!-- Индикаторы сброса по столбцам -->
            <div class="arrows" id="arrows-bar"></div>

            <!-- Банки-приёмники -->
            <div class="jars" id="containers-bar"></div>
        </div>

    </main>

    <div class="modal" id="victory-modal" hidden>
        <div class="modal__card">
            <div class="modal__badge">
                <svg aria-hidden="true"><use href="#i-trophy"></use></svg>
            </div>
            <h2 class="modal__title">ОТЛИЧНО!</h2>
            <p class="modal__text">Все оттенки кожи успешно отсортированы!</p>

            <div class="modal__stats">
                <div>
                    <span class="modal__stat-label">Сделано ходов</span>
                    <span class="modal__stat-value" id="final-moves">0</span>
                </div>
                <div class="modal__divider"></div>
                <div>
                    <span class="modal__stat-label">Оценка</span>
                    <div class="modal__stars" id="final-stars"></div>
                </div>
            </div>

            <button type="button" class="btn-primary" id="btn-next-level">
                СЛЕДУЮЩИЙ УРОВЕНЬ
                <svg aria-hidden="true"><use href="#i-arrow-right"></use></svg>
            </button>
        </div>
    </div>

    <script src="game.js" defer></script>
</body>
</html>
